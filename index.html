<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fondo con puntos negros</title>
    <style>
      :root {
        color-scheme: light;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        background-color: #ffffff;
        background-image: radial-gradient(circle, #000000 1.4px, transparent 1.4px);
        background-size: 6px 6px;
      }

      .square {
        width: 160px;
        height: 160px;
        margin-top: 24px;
        background: #ffffff;
        border: 1px solid #000000;
      }
    </style>
  </head>
  <body>
    <div class="square" aria-label="Cuadrado blanco en la parte superior"></div>
  </body>
</html>
